# Auto Release — creates a tag + GitHub release from the VERSION file, with
# the debug APK attached.
#
# A fix pushed to main is invisible to users until it is tagged: the release
# is what people install from. This workflow closes that gap: whenever code
# is pushed to main, it reads VERSION and, if no tag v<VERSION> exists yet,
# builds the debug APK and creates the tag and a release for it (notes
# auto-generated from the commits since the last tag), with the APK attached
# as a release asset.
#
# That makes the flow: push a fix (bumping VERSION) -> a release appears
# automatically with an installable APK -> no manual release, no waiting on
# the CI artifact page.
#
# It is idempotent: if the tag already exists it does nothing, so pushing
# more commits without bumping VERSION never creates a duplicate release.
name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up release signing key (from repository secrets)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Android only installs an update over an existing app when both APKs
          # are signed with the SAME key. A debug build is signed with the build
          # machine's throwaway debug key, so phones refuse to update from one
          # release to the next ("App not installed"). With the four secrets set,
          # every release is signed with one permanent key and updates install.
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release-key.jks
            {
              echo "storeFile=release-key.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: releasing a debug-signed APK. Phones may refuse to install it over a previous release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "Tag ${TAG} already exists, nothing to do."
            exit 0
          fi
          chmod +x gradlew
          if [ "$SIGNED" = "true" ]; then
            echo "Building release-signed APK for ${TAG}."
            ./gradlew assembleRelease --stacktrace
            APK="app/build/outputs/apk/release/app-release.apk"
            ASSET="OwnPBX-${TAG}.apk"
          else
            echo "Building debug APK for ${TAG}."
            ./gradlew assembleDebug --stacktrace
            APK="app/build/outputs/apk/debug/app-debug.apk"
            ASSET="OwnPBX-${TAG}-debug.apk"
          fi
          cp "${APK}" "${ASSET}"
          echo "Creating release ${TAG} from main."
          gh release create "${TAG}" --target main --title "${TAG}" --generate-notes "${ASSET}"

      - name: Remove signing material
        if: always()
        run: rm -f release-key.jks keystore.properties
