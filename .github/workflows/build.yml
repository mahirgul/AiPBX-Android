name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # A published GitHub Release goes to Google Play. A push only builds and tests: the
  # versionCode comes from VERSION, and Play takes every versionCode once.
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      upload_to_play:
        description: 'Upload the bundle to Google Play'
        required: true
        type: boolean
        default: false
      track:
        description: 'Google Play track'
        required: true
        default: 'production'
        type: choice
        options: [ production, alpha, internal, beta ]
      release_status:
        description: 'Release status (draft = save for review in the Play Console)'
        required: true
        default: 'completed'
        type: choice
        options: [ completed, draft, inProgress, halted ]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test Android App
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests & Lint
        run: ./gradlew testDebugUnitTest lintRelease --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Setup Release Keystore (if secrets provided)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > release-key.jks
            echo "storeFile=release-key.jks" > keystore.properties
            echo "storePassword=$KEYSTORE_PASSWORD" >> keystore.properties
            echo "keyAlias=$KEY_ALIAS" >> keystore.properties
            echo "keyPassword=$KEY_PASSWORD" >> keystore.properties
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "Release keystore secrets not provided. Skipping release signing."
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Release Bundle & APK (if keystore configured)
        if: steps.keystore.outputs.has_keystore == 'true'
        run: |
          ./gradlew bundleRelease assembleRelease --stacktrace
          bash bin/edge_to_edge_audit.sh
          bash bin/check_deprecated_window_apis.sh app/build/outputs/apk/release/app-release.apk app/build/outputs/mapping/release/mapping.txt

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AiPBX-Android-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release Artifacts (if built)
        if: steps.keystore.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AiPBX-Android-Release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab

      - name: Check Google Play upload eligibility
        id: check_upload
        if: steps.keystore.outputs.has_keystore == 'true' && github.event_name != 'pull_request'
        env:
          PLAY_KEY_JSON: ${{ secrets.PLAY_STORE_JSON_KEY }}
          EVENT: ${{ github.event_name }}
          INPUT_UPLOAD: ${{ inputs.upload_to_play }}
        run: |
          if [ -z "$PLAY_KEY_JSON" ]; then
            echo "::warning::PLAY_STORE_JSON_KEY secret is missing; skipping the Google Play upload."
            echo "can_upload=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "release" ] || [ "$INPUT_UPLOAD" = "true" ]; then
            echo "can_upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "$EVENT: build and tests only."
            echo "can_upload=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python for the Google Play upload
        if: steps.check_upload.outputs.can_upload == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Deploy the bundle to Google Play
        if: steps.check_upload.outputs.can_upload == 'true'
        env:
          PLAY_KEY_JSON: ${{ secrets.PLAY_STORE_JSON_KEY }}
          TRACK: ${{ inputs.track || 'production' }}
          STATUS: ${{ inputs.release_status || 'completed' }}
        run: |
          pip install --quiet --upgrade google-api-python-client google-auth
          umask 077
          printf '%s' "$PLAY_KEY_JSON" > play-service-account.json
          trap 'rm -f play-service-account.json' EXIT
          PLAY_STORE_JSON_KEY_FILE=play-service-account.json python3 upload_to_play_console.py "$TRACK" "$STATUS"

      - name: Attach the APK to the GitHub Release
        if: steps.keystore.outputs.has_keystore == 'true' && github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk aipbx-latest.apk
          gh release upload "$TAG" aipbx-latest.apk --clobber --repo "$GITHUB_REPOSITORY"
